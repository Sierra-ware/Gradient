version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gradient-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gradient
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - gradient_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: gradient-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  gradient_pgdata:
